# Ejemplo de los Secrets del Lab 5 (valores ficticios). En el clúster se crean
# con scripts/new-secrets.ps1 a partir de secrets/lab.env, que no se sube al repo.
apiVersion: v1
kind: Secret
metadata: { name: mqtt-auth, namespace: lab5 }
stringData:
  username: sensor
  password: CAMBIAR
---
apiVersion: v1
kind: Secret
metadata: { name: influxdb-auth, namespace: lab5 }
stringData:
  username: admin
  password: CAMBIAR
  token: CAMBIAR-TOKEN-LARGO
---
apiVersion: v1
kind: Secret
metadata: { name: grafana-admin, namespace: lab5 }
stringData:
  admin-user: admin
  admin-password: CAMBIAR
