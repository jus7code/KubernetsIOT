# Portal 1: WordPress + su propia MariaDB (namespace wordpress).
# La BD solo es alcanzable dentro del clúster (ClusterIP); el sitio por LoadBalancer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-db-data
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-db
  namespace: wordpress
  labels: { app: wordpress-db, portal: wordpress }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: wordpress-db }
  template:
    metadata:
      labels: { app: wordpress-db, portal: wordpress }
    spec:
      nodeSelector: { lab: lab6 }
      tolerations:
        - { key: lab, operator: Equal, value: lab6, effect: NoSchedule }
      containers:
        - name: mariadb
          image: mariadb:11.4.4
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress-db, key: root-password } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: wordpress-db, key: username } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress-db, key: password } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql, subPath: mysql }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wordpress-db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  type: ClusterIP
  selector: { app: wordpress-db }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-html
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
  labels: { app: wordpress, portal: wordpress }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: wordpress }
  template:
    metadata:
      labels: { app: wordpress, portal: wordpress }
    spec:
      nodeSelector: { lab: lab6 }
      tolerations:
        - { key: lab, operator: Equal, value: lab6, effect: NoSchedule }
      containers:
        - name: wordpress
          image: wordpress:6.6.2-apache
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: WORDPRESS_DB_HOST, value: "wordpress-db:3306" }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - name: WORDPRESS_DB_USER
              valueFrom: { secretKeyRef: { name: wordpress-db, key: username } }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress-db, key: password } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: html, mountPath: /var/www/html, subPath: html }
      volumes:
        - name: html
          persistentVolumeClaim: { claimName: wordpress-html }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  type: LoadBalancer
  selector: { app: wordpress }
  ports:
    - { name: http, port: 80, targetPort: 80 }
