# Portal 2: PrestaShop + su propia MariaDB (namespace prestashop), distinta
# de la de WordPress. Instalación automática (PS_INSTALL_AUTO) con el dominio
# = IP pública del Service, que deploy-lab6.ps1 guarda en el ConfigMap
# prestashop-domain una vez Azure asigna la IP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prestashop-apache
  namespace: prestashop
data:
  # cloudflared reenvía en HTTP con X-Forwarded-Proto: https; así PHP ve
  # HTTPS=on y PrestaShop no redirige a http:// ni entra en bucle.
  forwarded-https.conf: |
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    ServerName tienda.traumado.top
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prestashop-db-data
  namespace: prestashop
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestashop-db
  namespace: prestashop
  labels: { app: prestashop-db, portal: prestashop }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prestashop-db }
  template:
    metadata:
      labels: { app: prestashop-db, portal: prestashop }
    spec:
      nodeSelector: { lab: lab6 }
      tolerations:
        - { key: lab, operator: Equal, value: lab6, effect: NoSchedule }
      containers:
        - name: mariadb
          image: mariadb:11.4.4
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MARIADB_DATABASE, value: prestashop }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: prestashop-db, key: root-password } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: prestashop-db, key: username } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: prestashop-db, key: password } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql, subPath: mysql }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: prestashop-db-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prestashop-db
  namespace: prestashop
spec:
  type: ClusterIP
  selector: { app: prestashop-db }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prestashop-html
  namespace: prestashop
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests: { storage: 8Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestashop
  namespace: prestashop
  labels: { app: prestashop, portal: prestashop }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prestashop }
  template:
    metadata:
      labels: { app: prestashop, portal: prestashop }
    spec:
      nodeSelector: { lab: lab6 }
      tolerations:
        - { key: lab, operator: Equal, value: lab6, effect: NoSchedule }
      containers:
        - name: prestashop
          image: prestashop/prestashop:8.1.7-apache
          ports:
            - { name: http, containerPort: 80 }
          envFrom:
            - configMapRef: { name: prestashop-domain }
          env:
            - { name: DB_SERVER, value: prestashop-db }
            - { name: DB_NAME, value: prestashop }
            - { name: DB_PREFIX, value: ps_ }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: prestashop-db, key: username } }
            - name: DB_PASSWD
              valueFrom: { secretKeyRef: { name: prestashop-db, key: password } }
            - { name: PS_INSTALL_AUTO, value: "1" }
            - { name: PS_ERASE_DB, value: "0" }
            # HTTPS lo termina Cloudflare (túnel); ver prestashop-apache abajo
            - { name: PS_ENABLE_SSL, value: "1" }
            - { name: PS_LANGUAGE, value: es }
            - { name: PS_COUNTRY, value: CO }
            - { name: PS_FOLDER_ADMIN, value: admin-lab6 }
            - name: ADMIN_MAIL
              valueFrom: { secretKeyRef: { name: prestashop-admin, key: email } }
            - name: ADMIN_PASSWD
              valueFrom: { secretKeyRef: { name: prestashop-admin, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          # La instalación automática tarda varios minutos en el primer arranque
          startupProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 30
          volumeMounts:
            - { name: html, mountPath: /var/www/html, subPath: html }
            - { name: apache, mountPath: /etc/apache2/conf-enabled/forwarded-https.conf, subPath: forwarded-https.conf }
      volumes:
        - name: html
          persistentVolumeClaim: { claimName: prestashop-html }
        - name: apache
          configMap: { name: prestashop-apache }
---
apiVersion: v1
kind: Service
metadata:
  name: prestashop
  namespace: prestashop
spec:
  type: LoadBalancer
  selector: { app: prestashop }
  ports:
    - { name: http, port: 80, targetPort: 80 }
